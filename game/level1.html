<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第1关 · 三道密码锁 · 离谱星际穿越</title>
<style>
:root{
    --bg:#0a0a14;
    --panel:rgba(15,15,25,0.85);
    --border:rgba(255,255,255,0.08);
    --amber:#fbbf24;
    --coral:#f87171;
    --rose:#f472b6;
    --teal:#2dd4bf;
    --green:#22c55e;
    --red:#ef4444;
    --cream:#fef3c7;
    --muted:#6b7280;
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
canvas{display:block}
a{color:inherit}

/* View switching */
.view{position:absolute;inset:0;overflow:hidden}

/* Game canvas common */
.game-canvas{position:absolute;inset:0;width:100%;height:100%}

/* Animation slot */
.anim-slot{position:absolute;inset:0;z-index:50;display:none}
.anim-slot.anim-active{display:block}
.anim-wrapper{position:relative;width:100%;height:100%;background:#000}
.anim-video{width:100%;height:100%;object-fit:contain}
.anim-subtitle{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:8px;font-size:14px;color:rgba(255,255,255,0.85)}
.anim-skip{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s}
.anim-skip:hover{background:rgba(255,255,255,0.15);color:#fff}

/* Common panels (converted from ID to class) */
.tangbao-panel{position:absolute;top:20px;right:20px;width:220px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px);z-index:15}
.tangbao-title{font-size:11px;font-weight:700;color:var(--amber);padding:8px 14px;border-bottom:1px solid var(--border);letter-spacing:1px}
.tangbao-body{padding:10px 14px;font-size:11px;line-height:1.7;color:var(--cream);min-height:30px}

.hp-bar{position:absolute;top:20px;left:20px;width:200px;z-index:15}
.hp-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.hp-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:4px;transition:width .3s;width:100%}
.hp-fill.low{background:linear-gradient(90deg,var(--red),var(--coral))}

.progress-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;z-index:15}
.progress-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-align:center}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:3px;transition:width .3s;width:0%}

/* Dialog (converted from ID to class) */
.dialog-overlay{position:absolute;inset:0;z-index:20;display:none}
.dialog-overlay.show{display:flex;align-items:center;justify-content:center}
.dialog-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px 32px;max-width:600px;width:90%;backdrop-filter:blur(12px);cursor:pointer}
.dialog-speaker{font-size:12px;font-weight:700;margin-bottom:8px}
.dialog-text{font-size:15px;line-height:1.8;color:var(--cream)}
.dialog-hint{text-align:right;font-size:10px;color:var(--muted);margin-top:12px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

/* Pass/Fail screens (already class-based) */
.pass-screen,.fail-screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.9);opacity:0;pointer-events:none;transition:opacity .5s}
.pass-screen.show,.fail-screen.show{opacity:1;pointer-events:auto}
.pass-screen .title{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--amber),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;margin-bottom:12px}
.fail-screen .title{font-size:36px;font-weight:800;color:var(--red);letter-spacing:6px;margin-bottom:12px}
.pass-screen .sub,.fail-screen .sub{font-size:13px;color:var(--muted);margin-bottom:30px;letter-spacing:2px}
.pass-screen button,.fail-screen button{padding:12px 36px;background:transparent;border:1.5px solid var(--amber);border-radius:10px;color:var(--amber);font-size:14px;cursor:pointer;transition:all .25s;letter-spacing:2px}
.pass-screen button:hover,.fail-screen button:hover{background:var(--amber);color:#000;transform:scale(1.05)}

/* Screen flash (converted from ID to class) */
.screen-flash{position:absolute;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}

/* Key hint */
kbd{display:inline-block;padding:2px 8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:4px;font-size:11px;font-family:monospace}

/* ===== 第1关专属样式(三道密码锁) ===== */
/* ================================================================
   LEVEL 1 INLINE STYLES (IDs prefixed with l1-) - 3-stage lock
   ================================================================ */
#l1-stage-info{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:12px;align-items:center}
.l1-stage-badge{padding:6px 16px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;color:var(--muted);letter-spacing:2px;transition:all .3s}
.l1-stage-badge.active{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,0.08);box-shadow:0 0 10px rgba(251,191,36,0.2)}
.l1-stage-badge.done{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.08)}

/* --- Stage 1: Safe Cracking --- */
#l1-safe-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:none}
#l1-safe-panel.show{display:block}
.l1-safe-title{display:none}
#l1-safe-target{font-size:22px;color:var(--green);text-align:center;margin-bottom:16px;letter-spacing:2px}
#l1-safe-target-char{display:inline-block;font-size:44px;font-weight:900;color:#22c55e;background:rgba(34,197,94,0.1);border:2px solid rgba(34,197,94,0.5);border-radius:12px;padding:4px 24px;margin-left:8px;font-family:monospace;text-shadow:0 0 10px rgba(34,197,94,0.5)}
#l1-safe-grid-wrap{background:rgba(0,0,0,0.7);border:2px solid var(--border);border-radius:16px;padding:0;position:relative;overflow:hidden;margin:0 auto}
#l1-safe-grid-canvas{display:block;width:100%;height:100%}
.l1-safe-hint{font-size:15px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
#l1-safe-locked{display:flex;gap:10px;justify-content:center;margin-top:16px}
.l1-safe-char{width:56px;height:56px;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-family:monospace;color:var(--muted)}
.l1-safe-char.filled{border-color:var(--green);color:var(--green)}
.l1-safe-char.current{border-color:var(--amber);animation:l1currentPulse 1s infinite}

/* --- Stage 2: Morse Code Lock --- */
#l1-morse-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(78vw,1280px);max-height:94vh;overflow-y:auto;z-index:10;display:none;text-align:center}
#l1-morse-panel.show{display:block}
.l1-morse-title{font-size:20px;color:var(--amber);letter-spacing:4px;margin-bottom:12px}
/* 左右分栏: 左=已获取密码+破译线索框, 右=密码键盘(同图一) */
.l1-morse-body{display:flex;gap:20px;align-items:stretch;justify-content:center;text-align:left}
.l1-morse-left{flex:1.35;min-width:0;display:flex;flex-direction:column;gap:12px}
.l1-morse-right{flex:1;min-width:0;display:flex;flex-direction:column}
#l1-morse-display{display:flex;align-items:stretch;justify-content:flex-start;gap:10px;flex-wrap:wrap}
.l1-morse-card{background:rgba(0,0,0,0.5);border:2px solid var(--border);border-radius:10px;padding:10px 12px;flex:1;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.l1-morse-card.active{border-color:var(--amber);box-shadow:0 0 12px rgba(251,191,36,0.3);background:rgba(251,191,36,0.05)}
.l1-morse-card.done{border-color:var(--green);background:rgba(34,197,94,0.06)}
.l1-morse-card-label{font-size:11px;color:var(--muted);letter-spacing:1px}
.l1-morse-card.active .l1-morse-card-label{color:var(--amber)}
.l1-morse-card.done .l1-morse-card-label{color:var(--green)}
.l1-morse-pattern{display:flex;align-items:center;gap:4px;min-height:18px;flex-wrap:wrap;justify-content:center}
.l1-morse-dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);flex-shrink:0}
.l1-morse-dash{width:28px;height:11px;border-radius:6px;background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);flex-shrink:0}
.l1-morse-card-filled{font-size:26px;font-weight:900;color:var(--green);font-family:monospace;line-height:1}
@keyframes l1shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* 右侧电话式键盘 3 列 */
#l1-morse-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;grid-auto-rows:1fr}
.l1-morse-key{padding:0;border:1.5px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.04);color:var(--cream);font-size:26px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;display:flex;align-items:center;justify-content:center;min-height:58px}
.l1-morse-key:hover{border-color:var(--amber);background:rgba(251,191,36,0.08);transform:translateY(-2px)}
.l1-morse-key:active{transform:translateY(0)}
.l1-morse-key.special{color:var(--amber);font-size:20px}
/* 破译线索:专门框起来(2列网格,每格 摩斯符号+数字) */
.l1-morse-ref{border:1.5px solid rgba(251,191,36,0.35);border-radius:12px;padding:12px 16px;background:rgba(0,0,0,0.35);text-align:left;flex:1}
.l1-morse-ref-title{font-size:14px;font-weight:700;color:var(--amber);letter-spacing:2px;margin-bottom:8px}
.l1-morse-ref-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.l1-morse-ref-cell{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:6px;padding:10px 14px;background:rgba(120,140,165,0.16)}
.l1-morse-ref-cell .mr-sym{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.l1-morse-ref-cell .mr-slot{width:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mr-dot{width:13px;height:13px;border-radius:50%;background:rgba(206,220,232,0.9);box-shadow:0 0 4px rgba(180,200,220,0.35)}
.mr-dash{width:22px;height:8px;border-radius:4px;background:rgba(206,220,232,0.9);box-shadow:0 0 4px rgba(180,200,220,0.35)}
.l1-morse-ref-cell .mn{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:28px;font-weight:300;color:rgba(228,236,244,0.92);line-height:1;min-width:28px;text-align:right;flex-shrink:0}

/* --- Stage 3: Fixed Password --- */
#l1-fixed-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:94vw;z-index:10;display:none;text-align:center}
#l1-fixed-panel.show{display:block}
.l1-fixed-title{font-size:14px;color:var(--amber);letter-spacing:3px;margin-bottom:10px}
.l1-fixed-clue{background:rgba(0,0,0,0.5);border:1.5px solid rgba(251,191,36,0.3);border-radius:12px;padding:14px 20px;margin-bottom:16px}
#l1-fixed-display{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.l1-fixed-box{width:48px;height:60px;border:2px solid var(--border);border-radius:12px;background:rgba(0,0,0,0.5);font-size:26px;font-weight:700;color:var(--cream);text-align:center;display:flex;align-items:center;justify-content:center;font-family:monospace;transition:all .2s}
.l1-fixed-box.active{border-color:var(--amber);box-shadow:0 0 12px rgba(251,191,36,0.3)}
.l1-fixed-box.filled{border-color:var(--teal);color:var(--teal)}
.l1-fixed-box.correct{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.08)}
.l1-fixed-box.wrong{border-color:var(--red);color:var(--red);animation:l1shake .3s}
#l1-fixed-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.l1-fixed-key{padding:13px 0;border:1.5px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.04);color:var(--cream);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.l1-fixed-key:hover{border-color:var(--amber);background:rgba(251,191,36,0.08);transform:translateY(-2px)}
.l1-fixed-key:active{transform:translateY(0)}
.l1-fixed-key.special{color:var(--amber);font-size:14px}
.l1-fixed-clue{background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.15);border-radius:8px;padding:8px 14px;margin-top:14px;font-size:12px;color:var(--amber);text-align:center;min-height:20px}

/* --- Common --- */
.l1-flash-correct{position:absolute;inset:0;background:rgba(34,197,94,0.15);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.l1-flash-correct.show{opacity:1}
.l1-flash-wrong{position:absolute;inset:0;background:rgba(239,68,68,0.15);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.l1-flash-wrong.show{opacity:1}

</style>
</head>

<div id="skip-btn" onclick="location.href='level2.html'" style="position:fixed;top:12px;right:12px;z-index:9999;padding:6px 14px;border:1.5px solid rgba(251,191,36,0.6);border-radius:18px;background:rgba(15,15,25,0.75);backdrop-filter:blur(8px);color:#fbbf24;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:2px;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 0 12px rgba(251,191,36,0.2);">跳过本关 ⏭</div>
<div id="view-level1" class="view" style="display:none">

<script>
// 静默预览环境注入脚本残留错误(来源<anonymous>的"is not defined"), 游戏真实错误照常抛出
(function(){
  var _oe = window.onerror;
  window.onerror = function(msg, src, line, col, err){
    if (!src && typeof msg === 'string' && /is not defined$/.test(msg) && line <= 1) return true;
    if (_oe) return _oe.apply(this, arguments);
  };
})();
// ================================================================
// COMMON.JS  (AnimSlot / GameUI / SFX)
// ================================================================
// ================================================================
// COMMON.JS  (AnimSlot, GameUI, SFX)
// ================================================================

/**
 * 通用动画插槽系统
 */
const AnimSlot = {
    current: null,

    play(containerId, videoSrc, opts = {}) {
        return new Promise((resolve) => {
            const container = document.getElementById(containerId);
            if (!container || !videoSrc) {
                resolve();
                return;
            }

            container.innerHTML = '';
            container.classList.add('anim-active');

            const wrapper = document.createElement('div');
            wrapper.className = 'anim-wrapper';

            const video = document.createElement('video');
            video.src = videoSrc;
            video.autoplay = true;
            video.playsInline = true;
            video.className = 'anim-video';

            if (opts.subtitle) {
                const sub = document.createElement('div');
                sub.className = 'anim-subtitle';
                sub.textContent = opts.subtitle;
                wrapper.appendChild(sub);
            }

            if (opts.skip !== false) {
                const skipBtn = document.createElement('button');
                skipBtn.className = 'anim-skip';
                skipBtn.textContent = '跳过 →';
                skipBtn.onclick = () => {
                    container.classList.remove('anim-active');
                    container.innerHTML = '';
                    AnimSlot.current = null;
                    resolve();
                };
                wrapper.appendChild(skipBtn);
            }

            wrapper.appendChild(video);
            container.appendChild(wrapper);
            AnimSlot.current = { container, resolve };

            video.onended = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };

            video.onerror = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };
        });
    },

    skip() {
        if (AnimSlot.current) {
            const { container, resolve } = AnimSlot.current;
            container.classList.remove('anim-active');
            container.innerHTML = '';
            AnimSlot.current = null;
            resolve();
        }
    }
};

/**
 * 通用UI组件
 */
const GameUI = {
    createTangbao(title, msg) {
        return `

/**
 * 通用音效系统（Web Audio API）
 */
const SFX = {
    ctx: null,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    play(freq, dur, type = 'square', vol = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    sweep(f1, f2, dur, type = 'sawtooth', vol = 0.12) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    noise(dur, vol = 0.08) {
        this.init();
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start();
    },

    shoot() { this.sweep(800, 200, 0.08, 'square', 0.1); },
    hit() { this.sweep(400, 80, 0.15, 'sawtooth', 0.12); },
    explode() { this.noise(0.25, 0.1); this.sweep(200, 50, 0.3, 'sawtooth', 0.08); },
    pickup() { this.play(660, 0.1); setTimeout(() => this.play(880, 0.15), 80); },
    click() { this.play(440, 0.05, 'sine', 0.08); },
    success() { this.play(523, 0.12); setTimeout(() => this.play(659, 0.12), 100); setTimeout(() => this.play(784, 0.2), 200); },
    fail() { this.sweep(220, 110, 0.3, 'square', 0.1); },
    dot() { this.play(600, 0.08, 'sine', 0.12); },
    dash() { this.play(400, 0.25, 'sine', 0.12); },
};

// ================================================================
// LEVEL 1 - 三道密码锁
// ================================================================
// ================================================================
// LEVEL 1 - 3-Stage Password Lock
// ================================================================
(function() {
    const $ = (id) => document.getElementById('l1-' + id);
    let canvas, ctx;
    let W, H, time = 0;
    var rafId = 0;

    function resize() {
        if (!canvas) return;
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
    }

    // ==================== STAGE 1: Safe Cracking (Delta Force style) ====================
    var safeCanvas, safeCtx;
    var sCharset = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
    var sNumRows = 3;
    var sCharSize = 44;
    var sNumCols = 9;
    var sRows = [];
    var sRowTargets = [];
    var sLockedChars = [];
    var sTotalLocks = 3;
    var sCurrentLocks = 0;
    var sFeedbackTimer = 0;
    var sFeedbackText = '';
    var sFeedbackColor = '';
    var sShakeTime = 0;
    var sCanLock = true;
    var sSpacePressed = false;
    var sTargetAtCenter = false;
    var sHitZone = 20;
    var sRowLen = 12;

    function safeResize() {
        if (!safeCanvas) return;
        var wrap = $('safe-grid-wrap');
        // 转盘占屏幕约50%面积: 宽0.86W × 高0.62H ≈ 0.53×W×H,居中
        var ww = Math.min(innerWidth * 0.86, 1500);
        var hh = Math.min(innerHeight * 0.62, 720);
        wrap.style.width = ww + 'px';
        wrap.style.height = hh + 'px';
        safeCanvas.width = ww;
        safeCanvas.height = hh;
        // 动态字符尺寸: 3 行铺满转盘高度,列数按宽度自适应
        sCharSize = Math.floor((hh - 16) / sNumRows);
        sNumCols = Math.max(7, Math.floor(ww / sCharSize));
        sHitZone = Math.floor(sCharSize * 0.42);
    }

    function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
        }
        return arr;
    }

    function makeRowChars(target) {
        var pool = sCharset.replace(target, '');
        var chars = [];
        for (var i = 0; i < sRowLen - 3; i++) {
            chars.push(pool[Math.floor(Math.random() * pool.length)]);
        }
        for (var i = 0; i < 3; i++) {
            var pos = Math.floor(Math.random() * (chars.length + 1));
            chars.splice(pos, 0, target);
        }
        return chars.concat(chars);
    }

    function generateSafeRows() {
        sRows = [];
        sRowTargets = [];
        var charsetArr = sCharset.split('');
        var targets = [];
        for (var i = 0; i < sNumRows; i++) {
            var ch;
            do {
                ch = charsetArr[Math.floor(Math.random() * charsetArr.length)];
            } while (targets.indexOf(ch) >= 0);
            targets.push(ch);
        }
        for (var r = 0; r < sNumRows; r++) {
            sRowTargets[r] = targets[r];
            sRows.push({
                chars: makeRowChars(targets[r]),
                // 转速放慢: 按字符格尺寸比例(跨分辨率一致),约 0.018 格/帧
                speed: sCharSize * 0.018 + r * sCharSize * 0.004,
                offset: Math.random() * sRowLen * sCharSize,
                dir: r % 2 === 0 ? 1 : -1,
                locked: false
            });
        }
        updateSafeTargetDisplay();
    }

    function updateSafeTargetDisplay() {
        var targetEl = $('safe-target-char');
        if (targetEl && sRowTargets[sCurrentLocks]) {
            targetEl.textContent = sRowTargets[sCurrentLocks];
        }
    }

    function startSafeRound() {
        sCurrentLocks = 0;
        sLockedChars = [];
        generateSafeRows();
        sCanLock = true;
        updateSafeLockedDisplay();
        updateSafeTargetDisplay();
    }

    function regenerateRow(rowIdx) {
        var row = sRows[rowIdx];
        if (!row) return;
        var target = sRowTargets[rowIdx];
        row.chars = makeRowChars(target);
        row.offset = Math.random() * sRowLen * sCharSize;
        row.locked = false;
    }

    function getCenterCharInfo(rowIdx) {
        var row = sRows[rowIdx];
        if (!row) return null;
        var totalWidth = row.chars.length * sCharSize;
        var offset = ((row.offset % totalWidth) + totalWidth) % totalWidth;
        var gridW = sNumCols * sCharSize;
        var centerPos = gridW / 2;
        // 与绘制严格对齐: drawSafeGrid 中 textAlign='center',
        // 字符 i 的中心(相对 gridX)= i*sCharSize - offset(字符画在格线上)。
        // 原代码用 floor() 并 +sCharSize/2(误把字符当成在格子中央),与画面差半格,
        // 导致肉眼看到目标字符对齐绿线时判定 dist≈半格 > sHitZone 而失败。
        var exact = (centerPos + offset) / sCharSize;
        var idx = Math.round(exact) % row.chars.length;
        if (idx < 0) idx += row.chars.length;
        var charCenterX = idx * sCharSize - offset;
        var dist = charCenterX - centerPos;
        while (dist > totalWidth / 2) dist -= totalWidth;
        while (dist < -totalWidth / 2) dist += totalWidth;
        return { idx: idx, char: row.chars[idx], dist: Math.abs(dist) };
    }

    function trySafeLock() {
        if (!sCanLock) return;
        sCanLock = false;
        var rowIdx = sCurrentLocks;
        var info = getCenterCharInfo(rowIdx);
        if (!info) { sCanLock = true; return; }
        var target = sRowTargets[rowIdx];
        if (info.char === target && info.dist < sHitZone) {
            sRows[rowIdx].locked = true;
            sCurrentLocks++;
            sLockedChars.push(target);
            sFeedbackText = '\u2713';
            sFeedbackColor = '#22c55e';
            sFeedbackTimer = 25;
            SFX.success();
            updateSafeLockedDisplay();
            if (sCurrentLocks >= sTotalLocks) {
                setTimeout(function() { goStage2(); }, 800);
            } else {
                updateSafeTargetDisplay();
                setTimeout(function() { sCanLock = true; }, 350);
            }
        } else {
            sFeedbackText = '\u2717';
            sFeedbackColor = '#ef4444';
            sFeedbackTimer = 25;
            sShakeTime = 5;
            SFX.fail();
            setTimeout(function() {
                regenerateRow(rowIdx);
                sCanLock = true;
            }, 300);
        }
    }

    function updateSafeLockedDisplay() {
        var display = $('safe-locked');
        display.innerHTML = '';
        for (var i = 0; i < sTotalLocks; i++) {
            var div = document.createElement('div');
            div.className = 'l1-safe-char';
            if (i < sLockedChars.length) {
                div.classList.add('filled');
                div.textContent = sLockedChars[i];
            } else if (i === sCurrentLocks) {
                div.classList.add('current');
            }
            display.appendChild(div);
        }
    }

    function updateSafeOffsets() {
        for (var r = 0; r < sNumRows; r++) {
            var row = sRows[r];
            if (!row || row.locked) continue;
            row.offset += row.speed * row.dir;
        }
    }

    function drawSafeGrid() {
        if (!safeCtx) return;
        var sw = safeCanvas.width;
        var sh = safeCanvas.height;
        var gridW = sNumCols * sCharSize;
        var gridH = sNumRows * sCharSize;
        var gridX = (sw - gridW) / 2;
        var gridY = Math.max(4, (sh - gridH) / 2);
        // 字号随字符格尺寸等比缩放
        var fsLock = Math.round(sCharSize * 0.62);   // 命中高亮
        var fsAct  = Math.round(sCharSize * 0.52);   // 活动行
        var fsNorm = Math.round(sCharSize * 0.44);   // 普通字符
        var fsIcon = Math.round(sCharSize * 0.40);   // 锁图标
        var fsTip  = Math.round(sCharSize * 0.30);   // 底部提示
        var fsFb   = Math.round(sCharSize * 0.85);   // 反馈 ✓/✗

        safeCtx.save();
        if (sShakeTime > 0) {
            safeCtx.translate((Math.random() - 0.5) * sShakeTime, (Math.random() - 0.5) * sShakeTime);
            sShakeTime -= 0.5;
        }

        safeCtx.fillStyle = 'rgba(10,10,20,0.95)';
        safeCtx.fillRect(0, 0, sw, sh);

        var centerX = gridX + gridW / 2;
        var centerBoxX = centerX - sCharSize / 2;

        // Hit zone - wider green band
        safeCtx.fillStyle = 'rgba(34,197,94,0.12)';
        safeCtx.fillRect(centerX - sHitZone, gridY - 4, sHitZone * 2, gridH + 8);
        safeCtx.strokeStyle = 'rgba(34,197,94,0.5)';
        safeCtx.lineWidth = 2;
        safeCtx.beginPath();
        safeCtx.moveTo(centerX - sHitZone, gridY - 4);
        safeCtx.lineTo(centerX - sHitZone, gridY + gridH + 4);
        safeCtx.moveTo(centerX + sHitZone, gridY - 4);
        safeCtx.lineTo(centerX + sHitZone, gridY + gridH + 4);
        safeCtx.stroke();

        // Center line
        safeCtx.strokeStyle = 'rgba(34,197,94,0.7)';
        safeCtx.lineWidth = 1.5;
        safeCtx.beginPath();
        safeCtx.moveTo(centerX, gridY - 8);
        safeCtx.lineTo(centerX, gridY + gridH + 8);
        safeCtx.stroke();

        // Arrow
        safeCtx.fillStyle = 'rgba(34,197,94,0.8)';
        safeCtx.beginPath();
        safeCtx.moveTo(centerX - 7, gridY - 10);
        safeCtx.lineTo(centerX + 7, gridY - 10);
        safeCtx.lineTo(centerX, gridY - 3);
        safeCtx.closePath();
        safeCtx.fill();

        sTargetAtCenter = false;
        safeCtx.textAlign = 'center';
        safeCtx.textBaseline = 'middle';

        for (var r = 0; r < sNumRows; r++) {
            var row = sRows[r];
            if (!row) continue;
            var rowY = gridY + r * sCharSize;
            var isActiveRow = (r === sCurrentLocks && !row.locked);
            var isLockedRow = row.locked;
            var rowTarget = sRowTargets[r] || '';

            if (isLockedRow) {
                safeCtx.fillStyle = 'rgba(34,197,94,0.1)';
                safeCtx.fillRect(gridX - 6, rowY, gridW + 12, sCharSize);
                safeCtx.strokeStyle = 'rgba(34,197,94,0.4)';
                safeCtx.lineWidth = 1.5;
                safeCtx.strokeRect(gridX - 6, rowY, gridW + 12, sCharSize);
            } else if (isActiveRow) {
                safeCtx.fillStyle = 'rgba(251,191,36,0.12)';
                safeCtx.fillRect(gridX - 6, rowY, gridW + 12, sCharSize);
                safeCtx.strokeStyle = 'rgba(251,191,36,0.6)';
                safeCtx.lineWidth = 2;
                safeCtx.strokeRect(gridX - 6, rowY, gridW + 12, sCharSize);
                safeCtx.fillStyle = '#fbbf24';
                safeCtx.fillRect(gridX - 12, rowY + 4, 4, sCharSize - 8);
                safeCtx.fillRect(gridX + gridW + 8, rowY + 4, 4, sCharSize - 8);
            } else {
                safeCtx.fillStyle = 'rgba(255,255,255,0.03)';
                safeCtx.fillRect(gridX - 6, rowY, gridW + 12, sCharSize);
            }

            var totalWidth = row.chars.length * sCharSize;
            var offset = ((row.offset % totalWidth) + totalWidth) % totalWidth;
            var subOffset = offset % sCharSize;

            for (var c = 0; c < sNumCols + 2; c++) {
                var charIdx = (Math.floor(offset / sCharSize) + c) % row.chars.length;
                if (charIdx < 0) charIdx += row.chars.length;
                var ch = row.chars[charIdx];
                var x = gridX + c * sCharSize - subOffset;
                var y = rowY + sCharSize / 2;
                if (x < gridX - sCharSize || x > gridX + gridW + sCharSize) continue;

                var distFromCenter = Math.abs(x - centerX);
                var inHitZone = distFromCenter < sHitZone;

                if (isLockedRow) {
                    safeCtx.fillStyle = inHitZone ? '#22c55e' : 'rgba(34,197,94,0.2)';
                    safeCtx.font = inHitZone ? 'bold ' + fsLock + 'px monospace' : 'bold ' + fsNorm + 'px monospace';
                    if (inHitZone) {
                        safeCtx.shadowBlur = 10;
                        safeCtx.shadowColor = 'rgba(34,197,94,0.6)';
                    }
                } else if (inHitZone && isActiveRow && ch === rowTarget) {
                    sTargetAtCenter = true;
                    safeCtx.fillStyle = '#22c55e';
                    safeCtx.shadowBlur = 16;
                    safeCtx.shadowColor = 'rgba(34,197,94,0.9)';
                    safeCtx.font = 'bold ' + fsLock + 'px monospace';
                } else if (inHitZone && isActiveRow) {
                    safeCtx.fillStyle = '#fbbf24';
                    safeCtx.shadowBlur = 6;
                    safeCtx.shadowColor = 'rgba(251,191,36,0.4)';
                    safeCtx.font = 'bold ' + Math.round(sCharSize * 0.58) + 'px monospace';
                } else if (inHitZone) {
                    safeCtx.fillStyle = 'rgba(34,197,94,0.5)';
                    safeCtx.font = 'bold ' + Math.round(sCharSize * 0.48) + 'px monospace';
                } else if (isActiveRow) {
                    safeCtx.fillStyle = 'rgba(251,191,36,0.6)';
                    safeCtx.font = 'bold ' + fsAct + 'px monospace';
                } else {
                    safeCtx.fillStyle = 'rgba(255,255,255,0.15)';
                    safeCtx.font = 'bold ' + fsNorm + 'px monospace';
                }

                safeCtx.fillText(ch, x, y);
                safeCtx.shadowBlur = 0;
            }

            if (isLockedRow) {
                safeCtx.font = fsIcon + 'px sans-serif';
                safeCtx.fillStyle = '#22c55e';
                safeCtx.fillText('\uD83D\uDD12', gridX - sCharSize * 0.55, rowY + sCharSize / 2);
            }
        }

        if (sTargetAtCenter && sCanLock) {
            var pulse = Math.sin(Date.now() / 100) * 0.3 + 0.7;
            safeCtx.fillStyle = 'rgba(34,197,94,' + pulse + ')';
            safeCtx.font = 'bold ' + fsTip + 'px sans-serif';
            safeCtx.fillText('\u25BC 按空格锁定 \u25BC', centerX, gridY + gridH + fsTip + 6);
        }

        if (sFeedbackTimer > 0) {
            safeCtx.font = 'bold ' + fsFb + 'px sans-serif';
            safeCtx.fillStyle = sFeedbackColor;
            safeCtx.globalAlpha = sFeedbackTimer / 25;
            safeCtx.fillText(sFeedbackText, sw / 2, sh / 2);
            safeCtx.globalAlpha = 1;
            sFeedbackTimer--;
        }

        safeCtx.restore();
    }

    function renderSafe() {
        updateSafeOffsets();
        drawSafeGrid();
    }

    // ==================== STAGE 2: Morse Code Lock ====================
    var morseMap = {
        '0': ['dash','dash','dash','dash','dash'],
        '1': ['dot','dash','dash','dash','dash'],
        '2': ['dot','dot','dash','dash','dash'],
        '3': ['dot','dot','dot','dash','dash'],
        '4': ['dot','dot','dot','dot','dash'],
        '5': ['dot','dot','dot','dot','dot'],
        '6': ['dash','dot','dot','dot','dot'],
        '7': ['dash','dash','dot','dot','dot'],
        '8': ['dash','dash','dash','dot','dot'],
        '9': ['dash','dash','dash','dash','dot']
    };
    var mAnswer = '';
    var mInput = '';
    var mWrongCount = 0;
    var mMaxWrong = 5;
    var mTotalRounds = 2;
    var mCurrentRound = 0;

    function generateMorseRound() {
        mAnswer = '';
        var len = 4;
        for (var i = 0; i < len; i++) {
            mAnswer += Math.floor(Math.random() * 10).toString();
        }
        mInput = '';
        renderMorseDisplay();
        renderMorseInput();
    }

    function renderMorseDisplay() {
        var display = $('morse-display');
        display.innerHTML = '';
        for (var i = 0; i < mAnswer.length; i++) {
            var card = document.createElement('div');
            card.className = 'l1-morse-card';
            var cardLabel = document.createElement('div');
            cardLabel.className = 'l1-morse-card-label';
            cardLabel.textContent = '第 ' + (i + 1) + ' 位';
            card.appendChild(cardLabel);
            var patternBox = document.createElement('div');
            patternBox.className = 'l1-morse-pattern';
            var pattern = morseMap[mAnswer[i]];
            for (var j = 0; j < pattern.length; j++) {
                var el = document.createElement('div');
                el.className = pattern[j] === 'dot' ? 'l1-morse-dot' : 'l1-morse-dash';
                patternBox.appendChild(el);
            }
            card.appendChild(patternBox);
            if (i < mInput.length) {
                var filled = document.createElement('div');
                filled.className = 'l1-morse-card-filled';
                filled.textContent = mInput[i];
                card.appendChild(filled);
                card.classList.add('done');
            } else if (i === mInput.length) {
                card.classList.add('active');
            }
            display.appendChild(card);
        }
    }

    function renderMorseInput() {
        renderMorseDisplay();
    }

    function renderMorseKeypad() {
        var keypad = $('morse-keypad');
        keypad.innerHTML = '';
        var keys = ['1','2','3','4','5','6','7','8','9','0','C','\u2190'];
        for (var i = 0; i < keys.length; i++) {
            var key = document.createElement('div');
            key.className = 'l1-morse-key';
            if (keys[i] === 'C' || keys[i] === '\u2190') key.classList.add('special');
            key.textContent = keys[i];
            key.setAttribute('data-key', keys[i]);
            key.onclick = function() { handleMorseKey(this.getAttribute('data-key')); };
            keypad.appendChild(key);
        }
    }

    // 图形化摩斯参考表: 点=圆点, 划=横条, 5 槽位等宽
    function renderMorseRef() {
        var grid = $('morse-ref-grid');
        if (!grid) return;
        var codes = {'1':'.----','2':'..---','3':'...--','4':'....-','5':'.....','6':'-....','7':'--...','8':'---..','9':'----.','0':'-----'};
        var order = ['1','2','3','4','5','6','7','8','9','0'];
        var html = '';
        for (var k = 0; k < order.length; k++) {
            var n = order[k];
            var sym = '';
            for (var i = 0; i < 5; i++) {
                sym += '<span class="mr-slot"><i class="' + (codes[n][i] === '.' ? 'mr-dot' : 'mr-dash') + '"></i></span>';
            }
            html += '<div class="l1-morse-ref-cell"><span class="mr-sym">' + sym + '</span><span class="mn">' + n + '</span></div>';
        }
        grid.innerHTML = html;
    }

    function handleMorseKey(key) {
        if (key === 'C') {
            mInput = '';
            renderMorseInput();
            try { SFX.play(300, 0.05, 'square', 0.06); } catch(e) {}
        } else if (key === '\u2190') {
            if (mInput.length > 0) {
                mInput = mInput.slice(0, -1);
                renderMorseInput();
                try { SFX.play(300, 0.05, 'square', 0.06); } catch(e) {}
            }
        } else {
            if (mInput.length < mAnswer.length) {
                mInput += key;
                renderMorseInput();
                try { SFX.play(500 + parseInt(key) * 30, 0.05, 'sine', 0.08); } catch(e) {}
                if (mInput.length === mAnswer.length) {
                    setTimeout(checkMorseAnswer, 300);
                }
            }
        }
    }

    function checkMorseAnswer() {
        if (mInput === mAnswer) {
            try { SFX.success(); } catch(e) {}
            $('flash-correct').classList.add('show');
            setTimeout(function() { $('flash-correct').classList.remove('show'); }, 400);
            mCurrentRound++;
            if (mCurrentRound >= mTotalRounds) {
                setTimeout(function() { goStage3(); }, 1000);
            } else {
                setTimeout(function() { generateMorseRound(); }, 1000);
            }
        } else {
            try { SFX.fail(); } catch(e) {}
            $('flash-wrong').classList.add('show');
            setTimeout(function() { $('flash-wrong').classList.remove('show'); }, 400);
            mWrongCount++;
            if (mWrongCount >= mMaxWrong) {
                mWrongCount = 0;
                mCurrentRound = 0;
                setTimeout(function() { generateMorseRound(); }, 800);
            } else {
                setTimeout(function() {
                    mInput = '';
                    renderMorseInput();
                }, 600);
            }
        }
    }

    // ==================== STAGE 3: Fixed Password ====================
    var fAnswer = '2580';
    var fInput = '';
    var fAttempts = 0;
    var fMaxAttempts = 6;
    var fClues = [
        '第1位：宇宙中最小的质数是几？',
        '第2位：离谱星人一只手有几根手指？',
        '第3位：把无穷大符号∞旋转90°，看看像哪个数字？',
        '第4位：一切数字的起点和终点，代表"无"的数字是？'
    ];

    function renderFixedDisplay() {
        var display = $('fixed-display');
        display.innerHTML = '';
        for (var i = 0; i < fAnswer.length; i++) {
            var box = document.createElement('div');
            box.className = 'l1-fixed-box';
            if (i < fInput.length) {
                box.classList.add('filled');
                box.textContent = fInput[i];
            } else if (i === fInput.length) {
                box.classList.add('active');
            }
            display.appendChild(box);
        }
    }

    function renderFixedKeypad() {
        var keypad = $('fixed-keypad');
        keypad.innerHTML = '';
        var keys = ['1','2','3','4','5','6','7','8','9','C','0','\u2190'];
        for (var i = 0; i < keys.length; i++) {
            var key = document.createElement('div');
            key.className = 'l1-fixed-key';
            if (keys[i] === 'C' || keys[i] === '\u2190') key.classList.add('special');
            key.textContent = keys[i];
            key.setAttribute('data-key', keys[i]);
            key.onclick = function() { handleFixedKey(this.getAttribute('data-key')); };
            keypad.appendChild(key);
        }
    }

    function handleFixedKey(key) {
        if (key === 'C') {
            fInput = '';
            renderFixedDisplay();
            try { SFX.play(300, 0.05, 'square', 0.06); } catch(e) {}
        } else if (key === '\u2190') {
            if (fInput.length > 0) {
                fInput = fInput.slice(0, -1);
                renderFixedDisplay();
                try { SFX.play(300, 0.05, 'square', 0.06); } catch(e) {}
            }
        } else {
            if (fInput.length < fAnswer.length) {
                fInput += key;
                renderFixedDisplay();
                try { SFX.play(500 + parseInt(key) * 30, 0.05, 'sine', 0.08); } catch(e) {}
                if (fInput.length === fAnswer.length) {
                    setTimeout(checkFixedAnswer, 300);
                }
            }
        }
    }

    function checkFixedAnswer() {
        fAttempts++;
        if (fInput === fAnswer) {
            try { SFX.success(); } catch(e) {}
            var boxes = $('fixed-display').children;
            for (var i = 0; i < boxes.length; i++) {
                boxes[i].classList.remove('filled', 'wrong', 'active');
                boxes[i].classList.add('correct');
            }
            $('fixed-clue').innerHTML = '<div style="text-align:center;color:var(--green);font-weight:700;font-size:16px">密码正确！启动装置激活！</div>';
            setTimeout(function() {
                $('pass-screen').classList.add('show');
            }, 1200);
        } else {
            try { SFX.fail(); } catch(e) {}
            $('flash-wrong').classList.add('show');
            setTimeout(function() { $('flash-wrong').classList.remove('show'); }, 400);
            var boxes2 = $('fixed-display').children;
            for (var j = 0; j < boxes2.length; j++) {
                boxes2[j].classList.add('wrong');
            }
            // Keep showing all clues after wrong attempt
            if (fAttempts >= fMaxAttempts) {
                $('fixed-clue').innerHTML = '<div style="text-align:center;color:var(--red);font-weight:700;font-size:14px">糖包急了：密码就是 2-5-8-0！快输入！</div>';
            }
            setTimeout(function() {
                fInput = '';
                renderFixedDisplay();
            }, 800);
        }
    }

    // ==================== Stage transitions ====================
    function goStage2() {
        currentStage = 2;
        $('safe-panel').classList.remove('show');
        $('morse-panel').classList.add('show');
        $('stage-1').classList.remove('active');
        $('stage-1').classList.add('done');
        $('stage-2').classList.add('active');
        $('tangbao-body').textContent = '摩斯密码门！看电码图，对照参考表输入数字！';
        try { TangbaoVoice.speak('主人！第二道是摩斯密码！看电码图对照参考表输入！'); } catch(e) {}
        mCurrentRound = 0;
        mWrongCount = 0;
        renderMorseKeypad();
        generateMorseRound();
    }

    function goStage3() {
        currentStage = 3;
        $('morse-panel').classList.remove('show');
        $('fixed-panel').classList.add('show');
        $('stage-2').classList.remove('active');
        $('stage-2').classList.add('done');
        $('stage-3').classList.add('active');
        $('tangbao-body').textContent = '最后一道！根据糖包的线索输入4位密码！';
        try { TangbaoVoice.speak('主人！最后一道固定密码！看线索直接输入！'); } catch(e) {}
        fInput = '';
        fAttempts = 0;
        renderFixedKeypad();
        renderFixedDisplay();
        var clueHtml = '<div style="text-align:left;line-height:2.4;font-size:13px">';
        clueHtml += '<b style="color:var(--amber)">糖包密码谜题（4位数字）：</b><br>';
        for (var i = 0; i < fClues.length; i++) {
            clueHtml += '<span style="color:var(--cream)">' + fClues[i] + '</span><br>';
        }
        clueHtml += '</div>';
        $('fixed-clue').innerHTML = clueHtml;
        $('fixed-clue').style.color = '';
    }

    // ==================== Background ====================
    var currentStage = 1;
    var stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * 1920, y: Math.random() * 1080, size: Math.random() * 2, twinkle: Math.random() * Math.PI * 2 });
    }

    function drawBackground() {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(0, 0, W, H);

        stars.forEach(s => {
            const alpha = 0.3 + Math.sin(time * 0.02 + s.twinkle) * 0.3;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(s.x % W, s.y % H, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.strokeStyle = 'rgba(45,212,191,0.05)';
        ctx.lineWidth = 1;
        for (let y = 0; y < H; y += 4) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }

        const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 400);
        grad.addColorStop(0, 'rgba(251,191,36,0.05)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    function render() {
        if (activeView !== 'level1') return;
        time++;
        drawBackground();
        if (currentStage === 1) {
            renderSafe();
        }
        requestAnimationFrame(render);
    }

    // ==================== Input ====================
    window.addEventListener('keydown', function(e) {
        if (activeView !== 'level1') return;
        if (currentStage === 1) {
            if (e.key === ' ') {
                e.preventDefault();
                if (!sSpacePressed) {
                    sSpacePressed = true;
                    trySafeLock();
                }
            }
        } else if (currentStage === 2) {
            if (e.key >= '0' && e.key <= '9') handleMorseKey(e.key);
            else if (e.key === 'Backspace') handleMorseKey('\u2190');
            else if (e.key === 'c' || e.key === 'C') handleMorseKey('C');
        } else if (currentStage === 3) {
            if (e.key >= '0' && e.key <= '9') handleFixedKey(e.key);
            else if (e.key === 'Backspace') handleFixedKey('\u2190');
            else if (e.key === 'c' || e.key === 'C') handleFixedKey('C');
        }
    });

    window.addEventListener('keyup', function(e) {
        if (activeView !== 'level1') return;
        if (e.key === ' ') sSpacePressed = false;
    });

    window.addEventListener('resize', function() {
        if (activeView !== 'level1') return;
        resize();
        safeResize();
    });

    levelInits['level1'] = function init() {
        canvas = document.getElementById('canvas-l1');
        ctx = canvas.getContext('2d');
        safeCanvas = document.getElementById('l1-safe-grid-canvas');
        safeCtx = safeCanvas.getContext('2d');
        time = 0;
        currentStage = 1;

        // Reset stage badges
        $('stage-1').className = 'l1-stage-badge active';
        $('stage-2').className = 'l1-stage-badge';
        $('stage-3').className = 'l1-stage-badge';

        // Reset panels
        $('safe-panel').classList.add('show');
        $('morse-panel').classList.remove('show');
        $('fixed-panel').classList.remove('show');
        $('pass-screen').classList.remove('show');
        $('flash-correct').classList.remove('show');
        $('flash-wrong').classList.remove('show');

        // Reset stage 1
        sCurrentLocks = 0;
        sLockedChars = [];
        sFeedbackTimer = 0;
        sShakeTime = 0;
        sCanLock = true;
        sSpacePressed = false;

        updateSafeLockedDisplay();

        $('tangbao-body').textContent = '\u4e09\u9053\u5bc6\u7801\u9501\u6321\u4f4f\u4e86\u542f\u52a8\u88c5\u7f6e\uff01\u7b2c\u4e00\u9053\uff1a\u4fdd\u9669\u67dc\u7834\u89e3\uff01';
        TangbaoVoice.speak('\u4e3b\u4eba\uff01\u4e09\u9053\u5bc6\u7801\u9501\u6321\u4f4f\u4e86\u542f\u52a8\u88c5\u7f6e\uff01\u7b2c\u4e00\u9053\u662f\u4fdd\u9669\u67dc\u7834\u89e3\uff0c\u7eff\u8272\u9ad8\u4eae\u884c\u4e2d\u7684\u76ee\u6807\u5b57\u7b26\u5230\u8fbe\u4e2d\u592e\u65f6\u6309\u7a7a\u683c\uff01');

        resize();
        safeResize();
        renderMorseRef();
        startSafeRound();
        render();
    };
})();


// ===== 独立文件启动:直接进入第1关 =====
switchTo('level1');
</script>
