<style>
:root{
    --bg:#0a0a14;
    --panel:rgba(15,15,25,0.85);
    --border:rgba(255,255,255,0.08);
    --amber:#fbbf24;
    --coral:#f87171;
    --rose:#f472b6;
    --teal:#2dd4bf;
    --green:#22c55e;
    --red:#ef4444;
    --cream:#fef3c7;
    --muted:#6b7280;

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
canvas{display:block}
a{color:inherit}

/* View switching */
.view{position:absolute;inset:0;overflow:hidden}

/* Game canvas common */
.game-canvas{position:absolute;inset:0;width:100%;height:100%}

/* Animation slot */
.anim-slot{position:absolute;inset:0;z-index:50;display:none}
.anim-slot.anim-active{display:block}
.anim-wrapper{position:relative;width:100%;height:100%;background:#000}
.anim-video{width:100%;height:100%;object-fit:contain}
.anim-subtitle{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:8px;font-size:14px;color:rgba(255,255,255,0.85)}
.anim-skip{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s}
.anim-skip:hover{background:rgba(255,255,255,0.15);color:#fff}

/* Common panels (converted from ID to class) */
.tangbao-panel{position:absolute;top:20px;right:20px;width:220px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px);z-index:15}
.tangbao-title{font-size:11px;font-weight:700;color:var(--amber);padding:8px 14px;border-bottom:1px solid var(--border);letter-spacing:1px}
.tangbao-body{padding:10px 14px;font-size:11px;line-height:1.7;color:var(--cream);min-height:30px}

.hp-bar{position:absolute;top:20px;left:20px;width:200px;z-index:15}
.hp-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.hp-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:4px;transition:width .3s;width:100%}
.hp-fill.low{background:linear-gradient(90deg,var(--red),var(--coral))}

.progress-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;z-index:15}
.progress-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-align:center}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:3px;transition:width .3s;width:0%}

/* Dialog (converted from ID to class) */
.dialog-overlay{position:absolute;inset:0;z-index:20;display:none}
.dialog-overlay.show{display:flex;align-items:center;justify-content:center}
.dialog-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px 32px;max-width:600px;width:90%;backdrop-filter:blur(12px);cursor:pointer}
.dialog-speaker{font-size:12px;font-weight:700;margin-bottom:8px}
.dialog-text{font-size:15px;line-height:1.8;color:var(--cream)}
.dialog-hint{text-align:right;font-size:10px;color:var(--muted);margin-top:12px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

/* Pass/Fail screens (already class-based) */
.pass-screen,.fail-screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.9);opacity:0;pointer-events:none;transition:opacity .5s}
.pass-screen.show,.fail-screen.show{opacity:1;pointer-events:auto}
.pass-screen .title{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--amber),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;margin-bottom:12px}
.fail-screen .title{font-size:36px;font-weight:800;color:var(--red);letter-spacing:6px;margin-bottom:12px}
.pass-screen .sub,.fail-screen .sub{font-size:13px;color:var(--muted);margin-bottom:30px;letter-spacing:2px}
.pass-screen button,.fail-screen button{padding:12px 36px;background:transparent;border:1.5px solid var(--amber);border-radius:10px;color:var(--amber);font-size:14px;cursor:pointer;transition:all .25s;letter-spacing:2px}
.pass-screen button:hover,.fail-screen button:hover{background:var(--amber);color:#000;transform:scale(1.05)}

/* Screen flash (converted from ID to class) */
.screen-flash{position:absolute;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}

/* Key hint */

<script>
// 静默预览环境注入脚本残留错误(来源<anonymous>的"is not defined"), 游戏真实错误照常抛出
(function(){
  var _oe = window.onerror;
  window.onerror = function(msg, src, line, col, err){
    if (!src && typeof msg === 'string' && /is not defined$/.test(msg) && line <= 1) return true;
    if (_oe) return _oe.apply(this, arguments);
  };
})();

/**
 * 通用动画插槽系统
 */
const AnimSlot = {
    current: null,

    play(containerId, videoSrc, opts = {}) {
        return new Promise((resolve) => {
            const container = document.getElementById(containerId);
            if (!container || !videoSrc) {
                resolve();
                return;
            }

            container.innerHTML = '';
            container.classList.add('anim-active');

            const wrapper = document.createElement('div');
            wrapper.className = 'anim-wrapper';

            const video = document.createElement('video');
            video.src = videoSrc;
            video.autoplay = true;
            video.playsInline = true;
            video.className = 'anim-video';

            if (opts.subtitle) {
                const sub = document.createElement('div');
                sub.className = 'anim-subtitle';
                sub.textContent = opts.subtitle;
                wrapper.appendChild(sub);
            }

            if (opts.skip !== false) {
                const skipBtn = document.createElement('button');
                skipBtn.className = 'anim-skip';
                skipBtn.textContent = '跳过 →';
                skipBtn.onclick = () => {
                    container.classList.remove('anim-active');
                    container.innerHTML = '';
                    AnimSlot.current = null;
                    resolve();
                };
                wrapper.appendChild(skipBtn);
            }

            wrapper.appendChild(video);
            container.appendChild(wrapper);
            AnimSlot.current = { container, resolve };

            video.onended = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };

            video.onerror = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };
        });
    },

    skip() {
        if (AnimSlot.current) {
            const { container, resolve } = AnimSlot.current;
            container.classList.remove('anim-active');
            container.innerHTML = '';
            AnimSlot.current = null;
            resolve();
        }
    }
};

/**

/**
 * 通用音效系统（Web Audio API）
 */
const SFX = {
    ctx: null,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    play(freq, dur, type = 'square', vol = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    sweep(f1, f2, dur, type = 'sawtooth', vol = 0.12) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    noise(dur, vol = 0.08) {
        this.init();
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start();
    },

    shoot() { this.sweep(800, 200, 0.08, 'square', 0.1); },
    hit() { this.sweep(400, 80, 0.15, 'sawtooth', 0.12); },
    explode() { this.noise(0.25, 0.1); this.sweep(200, 50, 0.3, 'sawtooth', 0.08); },
    pickup() { this.play(660, 0.1); setTimeout(() => this.play(880, 0.15), 80); },
    click() { this.play(440, 0.05, 'sine', 0.08); },
    success() { this.play(523, 0.12); setTimeout(() => this.play(659, 0.12), 100); setTimeout(() => this.play(784, 0.2), 200); },
    fail() { this.sweep(220, 110, 0.3, 'square', 0.1); },
    dot() { this.play(600, 0.08, 'sine', 0.12); },
    dash() { this.play(400, 0.25, 'sine', 0.12); },
};

/**
 * \u7cd6\u5305\u8bed\u97f3\u63d0\u793a\u7cfb\u7edf\uff08Web Speech API\uff09
 */
var TangbaoVoice = {
    speak: function(text) {
        try {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = 1.3;
            u.pitch = 1.3;
            u.volume = 0.8;
            window.speechSynthesis.speak(u);
        } catch(e) {}
    },
    stop: function() {
        try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
    }
};

let activeView = null;

function switchTo(viewName) {
    // Hide all views
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    // Show target view
    const view = document.getElementById('view-' + viewName);
    if (view) view.style.display = 'block';
    activeView = viewName;
    // Call init function for that view
    if (levelInits[viewName]) levelInits[viewName]();
}

// ================================================================
(function() {
    const $ = (id) => document.getElementById('l3-' + id);
    const viewEl = () => document.getElementById('view-level3');
    let canvas, ctx;
    let W, H, time = 0;

    function resize() {
        if (!canvas) return;
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
    }

    const questions = [
        {
            q: '1+1 等于几？',
            choices: ['2', '11', '王田丰', '你猜'],
            correct: 2,
            explain: '长老："王田丰？！这都什么和什么啊！离谱到无法反驳！"',
            absurd: 30
        },
        {
            q: '天空为什么是蓝色的？',
            choices: ['瑞利散射', '上帝画的', '鱼在下面吹蓝色泡泡', '我怎么知道'],
            correct: 2,
            explain: '长老："鱼吹泡泡？！太离谱了……可是我无法证伪……"',
            absurd: 25
        },
        {
            q: '怎样才能最快从北京到上海？',
            choices: ['坐飞机', '坐高铁', '闭上眼睛想一下', '打开地图看一眼'],
            correct: 3,
            explain: '长老："打开地图就到了？！我无言以对！"',
            absurd: 25
        },
        {
            q: '人为什么要睡觉？',
            choices: ['恢复体力', '梦里有答案', '床在召唤', '不睡会被床嘲笑'],
            correct: 3,
            explain: '长老："被床嘲笑？！这……太离谱了！"',
            absurd: 20
        },
        {
            q: '为什么猫喜欢抓老鼠？',
            choices: ['本能', '老鼠欠它钱', '猫和老鼠是CP', '因为猫不会抓狗'],
            correct: 1,
            explain: '长老："老鼠欠猫钱？！什么逻辑！但确实离谱！"',
            absurd: 20
        }
    ];

    let currentQ = 0;
    let absurdLevel = 0;
    let answered = false;
    let timerLeft = 100;
    let timerRAF = null;

    function renderQuestion() {
        const q = questions[currentQ];
        $('q-num').textContent = `第 ${currentQ + 1} / ${questions.length} 题`;
        $('q-text').textContent = q.q;

        const choicesEl = $('q-choices');
        choicesEl.innerHTML = '';
        q.choices.forEach((c, i) => {
            const div = document.createElement('div');
            div.className = 'l3-quiz-choice';
            div.innerHTML = `<div class="num">${'ABCD'[i]}</div><div>${c}</div>`;
            div.onclick = () => answerQuestion(i);
            choicesEl.appendChild(div);
        });

        answered = false;
        timerLeft = 100;
        startTimer();
    }

    function startTimer() {
        if (timerRAF) cancelAnimationFrame(timerRAF);
        function tick() {
            if (answered || activeView !== 'level3') return;
            timerLeft -= 0.12;
            if (timerLeft <= 0) {
                timerLeft = 0;
                answerQuestion(-1);
                return;
            }
            const fill = $('timer-fill');
            fill.style.width = timerLeft + '%';
            if (timerLeft < 30) fill.classList.add('warn');
            else fill.classList.remove('warn');
            timerRAF = requestAnimationFrame(tick);
        }
        timerRAF = requestAnimationFrame(tick);
    }

    function answerQuestion(idx) {
        if (answered) return;
        answered = true;
        if (timerRAF) cancelAnimationFrame(timerRAF);

        const q = questions[currentQ];
        const choices = viewEl().querySelectorAll('.l3-quiz-choice');
        choices.forEach(c => c.classList.add('disabled'));

        if (idx === q.correct) {
            choices[idx].classList.add('correct');
            absurdLevel = Math.min(100, absurdLevel + q.absurd);
            $('explain-result').textContent = '✓ 离谱成功！';
            $('explain-result').style.color = 'var(--green)';
            SFX.success();
        } else {
            if (idx >= 0) choices[idx].classList.add('wrong');
            choices[q.correct].classList.add('correct');
            absurdLevel = Math.min(100, absurdLevel + Math.floor(q.absurd * 0.3));
            $('explain-result').textContent = idx === -1 ? '⏰ 超时了！' : '✗ 不够离谱';
            $('explain-result').style.color = 'var(--red)';
            SFX.fail();
        }

        $('explain-text').textContent = q.explain;
        $('absurd-fill').style.width = absurdLevel + '%';
        $('tangbao-body').textContent = `离谱指数 ${absurdLevel}/100`;

        setTimeout(() => {
            if (activeView !== 'level3') return;
            $('explain-box').classList.add('show');
        }, 600);
    }

    // Stars for background
    const stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * 1920, y: Math.random() * 1080, size: Math.random() * 2, twinkle: Math.random() * Math.PI * 2, vx: (Math.random() - 0.5) * 0.2 });
    }

    function drawBackground() {
        // Pure black space
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        // Subtle deep purple glow
        const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.5);
        grad.addColorStop(0, 'rgba(130,80,220,0.05)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Distant stars - minimal, serious
        stars.forEach(s => {
            s.x += s.vx;
            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            const alpha = 0.15 + Math.sin(time * 0.015 + s.twinkle) * 0.15;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(s.x % W, s.y % H, s.size * 0.8, 0, Math.PI * 2);
            ctx.fill();
        });

        // Faint golden nebula band
        ctx.save();
        ctx.globalAlpha = 0.04;
        var nebGrad = ctx.createLinearGradient(0, H * 0.3, W, H * 0.7);
        nebGrad.addColorStop(0, 'rgba(255,170,0,0)');
        nebGrad.addColorStop(0.5, 'rgba(255,170,0,0.8)');
        nebGrad.addColorStop(1, 'rgba(255,170,0,0)');
        ctx.fillStyle = nebGrad;
        ctx.fillRect(0, H * 0.25, W, H * 0.5);
        ctx.restore();
    }

    function render() {
        if (activeView !== 'level3') return;
        time++;
        drawBackground();
        requestAnimationFrame(render);
    }

    // Explain box click handler (set once; element exists in DOM at script execution time)
    $('explain-box').onclick = function() {
        $('explain-box').classList.remove('show');

        if (currentQ < questions.length - 1) {
            currentQ++;
            setTimeout(renderQuestion, 300);
        } else {
            if (absurdLevel >= 50) {
                SFX.success();
                setTimeout(() => {
                    if (activeView !== 'level3') return;
                    $('pass-screen').classList.add('show');
                }, 300);
            } else {
                $('tangbao-body').textContent = '离谱指数不够！重新答题';
                currentQ = 0;
                absurdLevel = 0;
                $('absurd-fill').style.width = '0%';
                setTimeout(renderQuestion, 500);
            }
        }
    };

    window.addEventListener('resize', function() {
        if (activeView !== 'level3') return;
        resize();
    });

    levelInits['level3'] = function init() {
        canvas = document.getElementById('canvas-l3');
        ctx = canvas.getContext('2d');
        time = 0;
        currentQ = 0;
        absurdLevel = 0;
        answered = false;
        timerLeft = 100;
        if (timerRAF) cancelAnimationFrame(timerRAF);

        // Reset UI
        $('pass-screen').classList.remove('show');
        $('explain-box').classList.remove('show');
        $('absurd-fill').style.width = '0%';
        $('timer-fill').style.width = '100%';
        $('timer-fill').classList.remove('warn');
        $('tangbao-body').textContent = '\u9009\u62e9\u6700\u79bb\u8c31\u7684\u7b54\u6848\uff01\u79bb\u8c31\u6307\u6570\u6ee1\u683c\u5c31\u80fd\u8fc7\u5173';
        TangbaoVoice.speak('\u4e3b\u4eba\uff01\u79bb\u8c31\u661f\u4eba\u6765\u4e86\uff01\u9009\u6700\u79bb\u8c31\u7684\u7b54\u6848\uff0c\u79bb\u8c31\u6307\u6570\u6ee1\u683c\u5c31\u80fd\u901a\u5173\uff01');

        resize();
        render();
        renderQuestion();
    };
})();




// ===== 独立文件启动:直接进入第3关 =====
switchTo('level3');
</script>
