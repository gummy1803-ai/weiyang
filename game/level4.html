<style>
:root{
    --bg:#0a0a14;
    --panel:rgba(15,15,25,0.85);
    --border:rgba(255,255,255,0.08);
    --amber:#fbbf24;
    --coral:#f87171;
    --rose:#f472b6;
    --teal:#2dd4bf;
    --green:#22c55e;
    --red:#ef4444;
    --cream:#fef3c7;
    --muted:#6b7280;
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
canvas{display:block}
a{color:inherit}

/* View switching */
.view{position:absolute;inset:0;overflow:hidden}

/* Game canvas common */
.game-canvas{position:absolute;inset:0;width:100%;height:100%}

/* Animation slot */
.anim-slot{position:absolute;inset:0;z-index:50;display:none}
.anim-slot.anim-active{display:block}
.anim-wrapper{position:relative;width:100%;height:100%;background:#000}
.anim-video{width:100%;height:100%;object-fit:contain}
.anim-subtitle{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:8px;font-size:14px;color:rgba(255,255,255,0.85)}
.anim-skip{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s}
.anim-skip:hover{background:rgba(255,255,255,0.15);color:#fff}

/* Common panels (converted from ID to class) */
.tangbao-panel{position:absolute;top:20px;right:20px;width:220px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px);z-index:15}
.tangbao-title{font-size:11px;font-weight:700;color:var(--amber);padding:8px 14px;border-bottom:1px solid var(--border);letter-spacing:1px}
.tangbao-body{padding:10px 14px;font-size:11px;line-height:1.7;color:var(--cream);min-height:30px}

.hp-bar{position:absolute;top:20px;left:20px;width:200px;z-index:15}
.hp-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.hp-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:4px;transition:width .3s;width:100%}
.hp-fill.low{background:linear-gradient(90deg,var(--red),var(--coral))}

.progress-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;z-index:15}
.progress-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-align:center}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:3px;transition:width .3s;width:0%}

/* Dialog (converted from ID to class) */
.dialog-overlay{position:absolute;inset:0;z-index:20;display:none}
.dialog-overlay.show{display:flex;align-items:center;justify-content:center}
.dialog-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px 32px;max-width:600px;width:90%;backdrop-filter:blur(12px);cursor:pointer}
.dialog-speaker{font-size:12px;font-weight:700;margin-bottom:8px}
.dialog-text{font-size:15px;line-height:1.8;color:var(--cream)}
.dialog-hint{text-align:right;font-size:10px;color:var(--muted);margin-top:12px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

/* Pass/Fail screens (already class-based) */
.pass-screen,.fail-screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.9);opacity:0;pointer-events:none;transition:opacity .5s}
.pass-screen.show,.fail-screen.show{opacity:1;pointer-events:auto}
.pass-screen .title{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--amber),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;margin-bottom:12px}
.fail-screen .title{font-size:36px;font-weight:800;color:var(--red);letter-spacing:6px;margin-bottom:12px}
.pass-screen .sub,.fail-screen .sub{font-size:13px;color:var(--muted);margin-bottom:30px;letter-spacing:2px}
.pass-screen button,.fail-screen button{padding:12px 36px;background:transparent;border:1.5px solid var(--amber);border-radius:10px;color:var(--amber);font-size:14px;cursor:pointer;transition:all .25s;letter-spacing:2px}
.pass-screen button:hover,.fail-screen button:hover{background:var(--amber);color:#000;transform:scale(1.05)}

/* Screen flash (converted from ID to class) */
.screen-flash{position:absolute;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}

/* Key hint */
kbd{display:inline-block;padding:2px 8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:4px;font-size:11px;font-family:monospace}

/* ===== 第4关专属样式(穿越小行星带) ===== */

   LEVEL 4 INLINE STYLES (IDs prefixed with l4-)
   ================================================================ */
#l4-controls-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:15;font-size:12px;color:var(--muted);display:flex;gap:16px;align-items:center}
.l4-ctrl-item{display:flex;align-items:center;gap:6px}

#l4-progress-label{font-size:11px;color:var(--amber);margin-bottom:4px;letter-spacing:2px}
#l4-progress-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
#l4-progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:4px;transition:width .2s;width:0%}

#l4-gesture-btn{position:absolute;bottom:64px;right:24px;width:60px;height:60px;border:2px solid var(--border);border-radius:50%;background:rgba(255,255,255,0.04);color:var(--rose);font-size:24px;cursor:pointer;transition:all .2s;z-index:16;display:flex;align-items:center;justify-content:center}

/* 操控模式切换按钮 */

/* 摄像头预览(画中画) */

/* 契约互换(时空冻结)提示 */

#l4-swap-hint.show{display:block;animation:l4swapPulse .9s infinite}
#l4-swap-hint .t{font-size:16px;font-weight:800;color:#c4b5fd;letter-spacing:3px;margin-bottom:6px}
#l4-swap-hint .s{font-size:11px;color:rgba(255,255,255,0.78);line-height:1.7;margin-bottom:10px}
#l4-swap-cancel{padding:5px 18px;background:transparent;border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:rgba(255,255,255,0.85);font-size:12px;cursor:pointer}

.l4-mode-card{width:120px;padding:14px 8px;border:2px solid rgba(45,212,191,0.35);border-radius:12px;background:rgba(15,15,25,0.6);cursor:pointer;transition:all .2s;text-align:center;pointer-events:auto;-webkit-tap-highlight-color:rgba(45,212,191,0.3);touch-action:manipulation;user-select:none}

<script>
// 静默预览环境注入脚本残留错误(来源<anonymous>的"is not defined"), 游戏真实错误照常抛出
(function(){
  var _oe = window.onerror;
  window.onerror = function(msg, src, line, col, err){
    if (!src && typeof msg === 'string' && /is not defined$/.test(msg) && line <= 1) return true;
    if (_oe) return _oe.apply(this, arguments);
  };
})();
// ================================================================
// COMMON.JS  (AnimSlot / GameUI / SFX)
// ================================================================
// ================================================================
// COMMON.JS  (AnimSlot, GameUI, SFX)
// ================================================================

/**
 * 通用动画插槽系统
 */
const AnimSlot = {
    current: null,

    play(containerId, videoSrc, opts = {}) {
        return new Promise((resolve) => {
            const container = document.getElementById(containerId);
            if (!container || !videoSrc) {
                resolve();
                return;
            }

            container.innerHTML = '';
            container.classList.add('anim-active');

            const wrapper = document.createElement('div');
            wrapper.className = 'anim-wrapper';

            const video = document.createElement('video');
            video.src = videoSrc;
            video.autoplay = true;
            video.playsInline = true;
            video.className = 'anim-video';

            if (opts.subtitle) {
                const sub = document.createElement('div');
                sub.className = 'anim-subtitle';
                sub.textContent = opts.subtitle;
                wrapper.appendChild(sub);
            }

            if (opts.skip !== false) {
                const skipBtn = document.createElement('button');
                skipBtn.className = 'anim-skip';
                skipBtn.textContent = '跳过 →';
                skipBtn.onclick = () => {
                    container.classList.remove('anim-active');
                    container.innerHTML = '';
                    AnimSlot.current = null;
                    resolve();
                };
                wrapper.appendChild(skipBtn);
            }

            wrapper.appendChild(video);
            container.appendChild(wrapper);
            AnimSlot.current = { container, resolve };

            video.onended = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };

            video.onerror = () => {
                container.classList.remove('anim-active');
                container.innerHTML = '';
                AnimSlot.current = null;
                resolve();
            };
        });
    },

    skip() {
        if (AnimSlot.current) {
            const { container, resolve } = AnimSlot.current;
            container.classList.remove('anim-active');
            container.innerHTML = '';
            AnimSlot.current = null;
            resolve();
        }
    }
};

/**

/**
 * 通用音效系统（Web Audio API）
 */
const SFX = {
    ctx: null,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    play(freq, dur, type = 'square', vol = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    sweep(f1, f2, dur, type = 'sawtooth', vol = 0.12) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    noise(dur, vol = 0.08) {
        this.init();
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start();
    },

    shoot() { this.sweep(800, 200, 0.08, 'square', 0.1); },
    hit() { this.sweep(400, 80, 0.15, 'sawtooth', 0.12); },
    explode() { this.noise(0.25, 0.1); this.sweep(200, 50, 0.3, 'sawtooth', 0.08); },
    pickup() { this.play(660, 0.1); setTimeout(() => this.play(880, 0.15), 80); },
    click() { this.play(440, 0.05, 'sine', 0.08); },
    success() { this.play(523, 0.12); setTimeout(() => this.play(659, 0.12), 100); setTimeout(() => this.play(784, 0.2), 200); },
    fail() { this.sweep(220, 110, 0.3, 'square', 0.1); },
    dot() { this.play(600, 0.08, 'sine', 0.12); },
    dash() { this.play(400, 0.25, 'sine', 0.12); },
};

/**
 * \u7cd6\u5305\u8bed\u97f3\u63d0\u793a\u7cfb\u7edf\uff08Web Speech API\uff09
 */
var TangbaoVoice = {
    speak: function(text) {
        try {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = 1.3;
            u.pitch = 1.3;
            u.volume = 0.8;
            window.speechSynthesis.speak(u);
        } catch(e) {}
    },
    stop: function() {
        try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
    }
};

let activeView = null;
const levelInits = {};

function switchTo(viewName) {
    // Hide all views
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    // Show target view
    const view = document.getElementById('view-' + viewName);
    if (view) view.style.display = 'block';

    if (levelInits[viewName]) levelInits[viewName]();
}

// ================================================================
// LEVEL 4 - 穿越小行星带
// ================================================================
// ================================================================
// LEVEL 4 - Asteroid Dodge (Forward motion)
// ================================================================
(function() {
    var $ = function(id) { return document.getElementById('l4-' + id); };
    var canvas, ctx, W, H;
    var time = 0, screenShake = 0, flashRed = 0;
    var gameStarted = false, gameOver = false, swapMode = false;
    var rafId = 0;
    var SHIP_R = 13;
    var MAX_DIST = 8000;
    var gameMode = 0;        // 0=未选, 1=1分钟, 2=3分钟, 3=无限
    var timeLimit = 0;       // 毫秒, 无限模式=0
    var elapsed = 0;         // 已用时间(ms)
    var score = 0;           // 实时得分
    var difficulty = 0;      // 难度系数 0→1, 随游戏时间平滑上升
    var player = { x: 0, y: 0, baseY: 0, vx: 0, hp: 100, invuln: 0, tilt: 0 };
    var meteors = [], particles = [];
    var keys = {};
    // 手势滑动状态: 记录触控起点、实时位置、经EMA平滑后的水平速度(px/ms)
    var swipe = { active: false, startX: 0, startY: 0, lastX: 0, lastT: 0, vx: 0 };
    var distance = 0, spawnTimer = 0, sayLock = 0;
    var stars = [], farStars = [];
    for (var si = 0; si < 70; si++) stars.push({ x: Math.random(), y: Math.random(), size: Math.random()*1.5+0.6, tw: Math.random()*Math.PI*2 });
    for (var fi = 0; fi < 140; fi++) farStars.push({ x: Math.random(), y: Math.random(), brightness: Math.random()*0.3+0.08 });

    function resize() {
        if (!canvas) return;
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
        player.baseY = H - 100;
        if (!gameStarted) { player.x = W/2; player.y = player.baseY; }
    }

    function say(msg, voice) {
        $('tangbao-body').textContent = msg;
        if (voice) { try { TangbaoVoice.speak(msg); } catch(e){} }
    }
    function addParticles(x, y, color, n) {
        for (var i = 0; i < n; i++) {
            var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
            particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, size:2+Math.random()*2 });
        }
    }

    // ---------- 陨石生成(小型碎石 / 大型陨石) ----------
    function makeMeteor() {
        var big = Math.random() < 0.32 + difficulty * 0.13;   // 大型陨石占比 32%→45%
        var r = big ? 34+Math.random()*18 : 12+Math.random()*8;
        var numPts = big ? 10+Math.floor(Math.random()*4) : 7+Math.floor(Math.random()*4);
        var pts = [];
        for (var j = 0; j < numPts; j++) {
            var ang = (j/numPts)*Math.PI*2;
            pts.push({ angle: ang, r: r*(0.72+Math.random()*0.45) });
        }
        var speedBonus = difficulty * 4.5;    // 速度加成 0→+4.5, 随难度上升
        return {
            x: r+Math.random()*(W-r*2), y: -r-20,
            r: r, big: big, points: pts,
            rotation: Math.random()*Math.PI*2,
            rotSpeed: (Math.random()-0.5)*0.03,
            vy: (big ? 5.0+Math.random()*1.4 : 7.5+Math.random()*2.0) + speedBonus,
            vx: (Math.random()-0.5)*(1.0 + difficulty*1.2),  // 横向漂移随难度增加
            hue: big ? 6+Math.random()*14 : 26+Math.random()*18,
            cracks: big ? 3+Math.floor(Math.random()*3) : 1+Math.floor(Math.random()*2),
            warned: false, passed: false
        };
    }

    // ---------- 背景(竖向星流, 向上航行感) ----------
    function drawBackground() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
        var bg = ctx.createRadialGradient(W*0.5, H*0.25, 0, W*0.5, H*0.25, Math.max(W,H)*0.75);
        bg.addColorStop(0, 'rgba(130,80,220,0.05)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
        var farOff = (time*0.35) % H;
        for (var i = 0; i < farStars.length; i++) {
            var fs = farStars[i];
            var fy = (fs.y*H + farOff) % H;
            ctx.fillStyle = 'rgba(255,255,255,'+fs.brightness+')';
            ctx.fillRect(fs.x*W, fy, 1, 1);
        }
        var nearOff = (time*5.2) % (H+60);
        for (var i2 = 0; i2 < stars.length; i2++) {
            var s = stars[i2];
            var sy = (s.y*(H+60) + nearOff) % (H+60) - 30;
            var a = 0.3 + Math.sin(time*0.02 + s.tw)*0.2;
            ctx.fillStyle = 'rgba(221,221,255,'+a+')';
            ctx.fillRect(s.x*W, sy, s.size*0.7, s.size+4.6);
        }
    }

    // ---------- 陨石绘制 ----------
    function drawMeteor(m) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rotation);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        for (var i = 0; i < m.points.length; i++) {
            var p = m.points[i];
            var px = Math.cos(p.angle)*p.r + 3, py = Math.sin(p.angle)*p.r + 3;
            if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.fill();
        var g = ctx.createRadialGradient(-m.r*0.3, -m.r*0.3, 0, 0, 0, m.r);
        g.addColorStop(0, 'hsl('+m.hue+',18%,42%)');
        g.addColorStop(0.5, 'hsl('+m.hue+',14%,28%)');
        g.addColorStop(1, 'hsl('+m.hue+',10%,16%)');
        ctx.fillStyle = g;
        ctx.beginPath();
        for (var j = 0; j < m.points.length; j++) {
            var p2 = m.points[j];
            var x2 = Math.cos(p2.angle)*p2.r, y2 = Math.sin(p2.angle)*p2.r;
            if (j===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
        for (var ck = 0; ck < m.cracks; ck++) {
            var ca = (ck/m.cracks)*Math.PI*2 + m.rotation*0.5;
            ctx.beginPath();
            ctx.moveTo(Math.cos(ca)*m.r*0.2, Math.sin(ca)*m.r*0.2);
            ctx.lineTo(Math.cos(ca+0.3)*m.r*0.7, Math.sin(ca+0.3)*m.r*0.7);
            ctx.stroke();
        }
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.arc(m.r*0.2, m.r*0.1, m.r*0.12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-m.r*0.3, -m.r*0.2, m.r*0.08, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        if (m.big) {  // 大型陨石危险描边
            ctx.strokeStyle = 'rgba(248,113,113,0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(m.x, m.y, m.r+4, 0, Math.PI*2); ctx.stroke();
        }
    }

    // 时空冻结: 每颗陨石画可点击的紫色脉冲环
    function drawSwapRings() {
        for (var i = 0; i < meteors.length; i++) {
            var m = meteors[i];
            var pulse = 0.5+0.5*Math.sin(time*0.15 + i);
            ctx.strokeStyle = 'rgba(167,139,250,'+(0.55+pulse*0.4)+')';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(m.x, m.y, m.r+8+pulse*4, 0, Math.PI*2); ctx.stroke();
        }
    }

    // ---------- 飞船绘制(机头朝上) ----------
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(-Math.PI/2 + player.tilt);
        var trailLen = 25+Math.sin(time*0.3)*8;
        var tg = ctx.createLinearGradient(-trailLen,0,-5,0);
        tg.addColorStop(0,'rgba(255,170,0,0)');
        tg.addColorStop(0.5,'rgba(255,170,0,0.3)');
        tg.addColorStop(1,'rgba(255,200,50,0.7)');
        ctx.fillStyle = tg;
        ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(-trailLen,0); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,200,0.6)';
        ctx.beginPath(); ctx.moveTo(-5,-3); ctx.lineTo(-trailLen*0.5,0); ctx.lineTo(-5,3); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#2dd4bf';
        ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(45,212,191,0.4)';
        ctx.beginPath();
        ctx.moveTo(18,0); ctx.lineTo(-8,-11); ctx.lineTo(-5,0); ctx.lineTo(-8,11);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(4,0,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,170,0,0.5)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-2,-8); ctx.lineTo(2,-5);
        ctx.moveTo(-2,8); ctx.lineTo(2,5);
        ctx.stroke();
        if (player.invuln > 0) {
            ctx.strokeStyle = 'rgba(45,212,191,'+(player.invuln/55*0.7)+')';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
        }
        ctx.restore();
    }

    function drawParticles() {
        for (var i = particles.length-1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if (p.life <= 0) { particles.splice(i,1); continue; }
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size||2, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function passGame() {
        gameOver = true;
        try { SFX.success(); } catch(e){}
        say('时间到——成功穿出小行星带！', true);
        // 计算得分 + 高分对比
        score = Math.floor(distance) + Math.floor(elapsed / 100) * 5 + Math.max(0, player.hp) * 10;
        var isNew = saveHighScore(score);
        // 填充结算屏
        $('pass-title').textContent = '时间到！';
        $('pass-sub').innerHTML = '得分 <b style="color:var(--teal)">' + score + '</b>　最高 ' + getHighScore() + (isNew ? '　🏆 新纪录！' : '');
        setTimeout(function(){ if (activeView==='level4') $('pass-screen').classList.add('show'); }, 400);
    }
    function failGame() {
        gameOver = true;
        try { SFX.fail(); } catch(e){}
        // 计算得分 + 高分对比
        score = Math.floor(distance) + Math.floor(elapsed / 100) * 5;
        var isNew = saveHighScore(score);
        var mm = String(Math.floor(elapsed / 60000)).padStart(2, '0');
        var ss = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
        // 填充结算屏
        $('fail-sub').innerHTML = '得分 <b style="color:var(--teal)">' + score + '</b>　最高 ' + getHighScore() + (isNew ? '　🏆 新纪录！' : '') + '<br>存活 ' + mm + ':' + ss + '　里程 ' + Math.floor(distance);
        setTimeout(function(){ if (activeView==='level4') $('fail-screen').classList.add('show'); }, 500);
    }
    // 高分存取
    function getHighScore() {
        try { return parseInt(localStorage.getItem('l4_highscore_' + (gameMode || 1)) || '0', 10) || 0; } catch(e){ return 0; }
    }
    function saveHighScore(s) {
        try {
            var key = 'l4_highscore_' + (gameMode || 1);
            var old = parseInt(localStorage.getItem(key) || '0', 10) || 0;
            if (s > old) { localStorage.setItem(key, String(s)); return true; }
        } catch(e){}
        return false;
    }

    // ---------- 主更新 ----------
    function update() {
        if (sayLock > 0) sayLock--;
        if (flashRed > 0) flashRed -= 0.5;
        if (screenShake > 0) screenShake -= 0.5;
        if (!gameStarted || gameOver) return;

        // 陨石持续生成(时空冻结期间也照常生成, 只是悬停不动)
        spawnTimer++;
        var rate = Math.round(20 - difficulty * 14);   // 生成间隔 20帧→6帧, 密度随难度上升
        if (spawnTimer >= rate) { spawnTimer = 0; meteors.push(makeMeteor()); }

        if (swapMode) return;  // 时空冻结: 运动/碰撞/里程全部暂停

        // ---- 飞船移动: 摄像头绝对位置 / 键盘 / 触摸滑动 ----
        var accel = 0.9, maxSpeed = 7.5, deadzone = 0.08;
        if (camMode) {
            // 摄像头模式: 飞船平滑跟随手部水平位置 (只设速度, 位移由统一出口处理)
            if (camTargetX >= 0) {
                player.vx = (camTargetX - player.x) * 0.25;  // lerp 平滑速度
            } else {
                player.vx *= 0.9;                              // 手丢失: 缓停
            }
        } else {
            if (keys['ArrowLeft']||keys['a']||keys['A']) player.vx -= accel;
            if (keys['ArrowRight']||keys['d']||keys['D']) player.vx += accel;
            // 手势滑动: swipe.vx (px/ms) 映射为目标速度 (px/frame)
            if (swipe.active) {
                var sSpeed = swipe.vx * 16;            // px/ms → px/frame (约16ms/帧)
                if (Math.abs(sSpeed) > deadzone) {      // 死区: 过慢的微抖不响应
                    var targetVx = Math.max(-maxSpeed, Math.min(maxSpeed, sSpeed * 1.1));
                    player.vx += (targetVx - player.vx) * 0.20;  // 平滑过渡系数
                } else {
                    player.vx *= 0.88;                  // 死区内减速
                }
            } else {
                player.vx *= 0.82;                     // 松手后摩擦减速至停
            }
        }
        var effMax = camMode ? 18 : maxSpeed;   // 摄像头模式允许更快穿屏, 更跟手
        if (player.vx > effMax) player.vx = effMax;
        if (player.vx < -effMax) player.vx = -effMax;
        player.x += player.vx;
        player.x = Math.max(28, Math.min(W-28, player.x));
        player.y += (player.baseY - player.y)*0.08;   // 互换后平滑回到飞行线
        var targetTilt = Math.max(-0.35, Math.min(0.35, player.vx*0.05));
        player.tilt += (targetTilt - player.tilt)*0.2;
        if (player.invuln > 0) player.invuln--;

        // ---- 计时 / 得分 / HUD (固定步长: 每次 update = 1/60 秒) ----
        distance += 1.05;
        elapsed += STEP;
        // 限时模式: 到点通关
        if ((gameMode === 1 || gameMode === 2) && elapsed >= timeLimit) { passGame(); return; }
        // 难度曲线: ease-out 加压(前中期就明显变快); 限时模式整局爬到1, 无限模式2分钟封顶
        var rampDur = timeLimit > 0 ? timeLimit : 120000;
        var rt = Math.min(1, elapsed / rampDur);
        difficulty = 1 - Math.pow(1 - rt, 1.5);
        // 得分 = 里程 + 存活时间×5 + 剩余护盾×10
        score = Math.floor(distance) + Math.floor(elapsed / 100) * 5 + Math.max(0, player.hp) * 10;
        // HUD: 限时模式显示倒计时, 无限模式显示存活时间; 里程进度条改为得分条
        var remainMs = gameMode === 3 ? elapsed : Math.max(0, timeLimit - elapsed);
        var mm = String(Math.floor(remainMs / 60000)).padStart(2, '0');
        var ss = String(Math.floor((remainMs % 60000) / 1000)).padStart(2, '0');
        $('progress-label').textContent = '⏱ ' + mm + ':' + ss + '  |  得分 ' + score;
        $('progress-fill').style.width = Math.min(100, distance / 20000 * 100) + '%';

        // ---- 陨石运动 / 预警 / 碰撞 ----
        for (var i = meteors.length-1; i >= 0; i--) {
            var m = meteors[i];
            m.x += m.vx; m.y += m.vy; m.rotation += m.rotSpeed;
            if (m.x < m.r) { m.x = m.r; m.vx *= -1; }
            if (m.x > W-m.r) { m.x = W-m.r; m.vx *= -1; }

            if (!m.warned && m.y > player.y-430 && m.y < player.y-170 && Math.abs(m.x-player.x) < m.r+34) {
                m.warned = true;
                if (sayLock <= 0) {
                    if (m.big) { say('巨型陨石压顶，快滑开！'); sayLock = 70; }
                    else { say('碎石群迎面砸来，注意闪避！'); sayLock = 70; }
                }
            }
            if (!m.passed && m.y > player.y+26) {
                m.passed = true;
                if (Math.abs(m.x-player.x) < m.r+24 && sayLock <= 0) {
                    say('擦身而过，好险！'); sayLock = 80;
                    try { SFX.play(900,0.06,'triangle',0.06); } catch(e){}
                }
            }
            // 碰撞检测: 先做y距离早退(避开大多数陨石的O(1)判断), 再做圆判定
            var dy = m.y - player.y;
            if (Math.abs(dy) < m.r + SHIP_R + 4) {
                var dx = m.x - player.x;
                var rr = m.r*0.85 + SHIP_R;
                if (dx*dx+dy*dy < rr*rr && player.invuln <= 0) {
                var dmg = m.big ? 30 : 12;
                player.hp -= dmg;
                player.invuln = 55;
                screenShake = m.big ? 14 : 8; flashRed = 6;
                addParticles(player.x, player.y, '#ff3366', m.big?16:10);
                addParticles(m.x, m.y, '#c9a38a', 8);
                meteors.splice(i,1);
                $('hp-fill').style.width = Math.max(0,player.hp)+'%';
                if (player.hp < 30) $('hp-fill').classList.add('low');
                say(m.big ? '巨型陨石撞击！护盾-30' : '碎石撞击！护盾-12');
                if (m.big) {
                    // 大型陨石: 低频爆炸(噪声+低沉扫频, 持续较长)
                    try { SFX.noise(0.35, 0.12); SFX.sweep(160, 40, 0.45, 'sawtooth', 0.1); } catch(e){}
                } else {
                    // 小型碎石: 清脆短促撞击(高频三角波+短噪声)
                    try { SFX.play(320, 0.08, 'triangle', 0.09); SFX.noise(0.08, 0.05); } catch(e){}
                }
                if (player.hp <= 0) { player.hp = 0; failGame(); continue; }
                }
            }
            if (m.y > H+m.r+30) meteors.splice(i,1);
        }

        if (distance >= MAX_DIST && !gameOver) passGame();
    }

    // 固定时间步长: 无论帧率高低(如开摄像头推理掉到20fps), 逻辑每秒固定跑60步
    var STEP = 1000 / 60;
    var lastTs = 0, stepAcc = 0;
    function render(ts) {
        if (activeView !== 'level4') return;
        var frameDt = (typeof ts === 'number' && lastTs) ? ts - lastTs : STEP;
        lastTs = typeof ts === 'number' ? ts : 0;
        if (frameDt > 100 || frameDt <= 0) frameDt = STEP;   // 切后台/首帧钳制
        time++;
        try {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            drawBackground();
            for (var i = 0; i < meteors.length; i++) drawMeteor(meteors[i]);
            if (swapMode) drawSwapRings();
            drawParticles();
            drawPlayer();
            ctx.restore();
            if (swapMode) { ctx.fillStyle = 'rgba(120,90,220,0.10)'; ctx.fillRect(0,0,W,H); }
            if (flashRed > 0) { ctx.fillStyle = 'rgba(255,30,60,'+(flashRed/6*0.18)+')'; ctx.fillRect(0,0,W,H); }
        } catch(e) { console.error('L4 error:', e); }
        // 帧率低时一帧内补跑多个逻辑步, 最多4步防卡顿螺旋
        stepAcc += frameDt;
        var steps = 0;
        while (stepAcc >= STEP && steps < 4) {
            update();
            stepAcc -= STEP;
            steps++;
            if (gameOver) { stepAcc = 0; break; }
        }
        rafId = requestAnimationFrame(render);
    }

    // ---------- 星际契约互换(语音 / 手动) ----------
    function enterSwap() {
        if (!gameStarted || gameOver || swapMode) return;
        swapMode = true;
        $('gesture-btn').classList.add('swapping');
        $('swap-hint').classList.add('show');
        try { SFX.sweep(300,900,0.35,'sine',0.1); } catch(e){}
        say('星际契约生效——时空冻结！点一颗空旷处的陨石互换位置。', true);
    }
    function exitSwap() {
        swapMode = false;
        $('gesture-btn').classList.remove('swapping');
        $('swap-hint').classList.remove('show');
    }
    window.L4_contractSwap = enterSwap;
    window.L4_cancelSwap = function() {
        if (!swapMode) return;
        exitSwap();
        say('契约解除，继续航行。');
    };

    function trySelectAt(cx, cy) {
        if (!swapMode) return false;
        var best = null, bestD = 1e9;
        for (var i = 0; i < meteors.length; i++) {
            var m = meteors[i];
            var d = Math.hypot(m.x-cx, m.y-cy);
            if (d < m.r+18 && d < bestD) { best = m; bestD = d; }
        }
        if (!best) { say('要点一颗陨石才能互换哦！'); return false; }
        var sx = player.x, sy = player.y;
        addParticles(sx, sy, '#a78bfa', 14);
        addParticles(best.x, best.y, '#a78bfa', 14);
        player.x = best.x; player.y = best.y; player.vx = 0;
        player.invuln = Math.max(player.invuln, 45);  // 互换后短暂无敌, 平滑回到飞行线
        best.x = sx; best.y = sy; best.warned = true;
        try { SFX.sweep(700,1200,0.25,'triangle',0.12); } catch(e){}
        say('契约成立！飞船与陨石互换位置！', true);
        exitSwap();
        return true;
    }

    // ---------- 手势触发(双指点击 / 右键 / 按钮) ----------
    window.L4_toggleSwap = function() {
        if (!gameStarted || gameOver) return;
        if (swapMode) window.L4_cancelSwap();
        else enterSwap();
    };

    // ---------- 第二操控模式: MediaPipe Hands 手部关键点识别 ----------
    // 原理: AI 模型检测 21 个手部关键点, 取手掌中心 x 坐标 → 飞船左右移动
    var camMode = false;
    var mpHands = null, mpStream = null, mpVideo = null, mpRafId = null;
    var mpPreview = null, mpPreviewCtx = null;
    var camTargetX = -1;   // 手部绝对位置映射到屏幕的目标 x (-1=无手, 保持原位)

    function startCam() {
        console.log('[L4] startCam, Hands=', typeof window.Hands);
        var wrap = document.getElementById('l4-cam-wrap');
        var status = document.getElementById('l4-cam-status');
        wrap.classList.add('show');
        status.textContent = '正在加载手部识别模型…';

        mpPreview = document.getElementById('l4-cam-canvas');
        mpPreview.width = 160; mpPreview.height = 120;
        mpPreviewCtx = mpPreview.getContext('2d');

        mpVideo = document.getElementById('l4-cam-video');
        if (!mpVideo) {
            mpVideo = document.createElement('video');
            mpVideo.id = 'l4-cam-video';
            mpVideo.autoplay = true; mpVideo.playsInline = true; mpVideo.muted = true;
            mpVideo.style.display = 'none';
            document.body.appendChild(mpVideo);
        }

        try {
            mpHands = new window.Hands({ locateFile: function(f) {
                return '/libs/mediapipe/' + f;
            }});
            mpHands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.5
            });
            mpHands.onResults(onHandResults);
        } catch(e) {
            console.error('[L4] MediaPipe 初始化失败:', e);
            status.textContent = '模型加载失败';
            camMode = false; updateModeUI();
            say('手部识别模型加载失败，切回触摸操控。', true);
            return;
        }

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
            audio: false
        }).then(function(stream) {
            mpStream = stream;
            mpVideo.srcObject = stream;
            mpVideo.play();
            status.textContent = '✋ 左右移动手掌';
            say('摄像头已开启！左右移动手掌，飞船跟着移动！', true);
            var sending = false;
            function pump() {
                if (!camMode) return;
                if (mpVideo.readyState >= 2 && !sending) {
                    sending = true;
                    mpHands.send({ image: mpVideo }).then(function(){ sending = false; }).catch(function(){ sending = false; });
                }
                mpRafId = requestAnimationFrame(pump);
            }
            pump();
        }).catch(function(err) {
            console.error('[L4] 摄像头启动失败:', err);
            status.textContent = '摄像头启动失败';
            camMode = false; stopCam(); updateModeUI();
            if (err.name === 'NotAllowedError') {
                say('摄像头权限被拒绝，请在浏览器地址栏允许摄像头后重试。', true);
            } else {
                say('摄像头启动失败，切回触摸操控。', true);
            }
        });
    }

    function stopCam() {
        if (mpRafId) { cancelAnimationFrame(mpRafId); mpRafId = null; }
        if (mpStream) { mpStream.getTracks().forEach(function(t){ t.stop(); }); mpStream = null; }
        if (mpHands) { try { mpHands.close(); } catch(e){} mpHands = null; }
        if (mpVideo) { mpVideo.srcObject = null; }
        document.getElementById('l4-cam-wrap').classList.remove('show');
        camTargetX = -1;
    }

    // MediaPipe 回调: results.multiHandLandmarks[0] 是 21 个关键点 (归一化 0~1 坐标)
    function onHandResults(results) {
        // 在预览 canvas 上画摄像头画面 + 骨架
        if (mpPreviewCtx && results.image) {
            mpPreviewCtx.save();
            mpPreviewCtx.clearRect(0, 0, mpPreview.width, mpPreview.height);
            mpPreviewCtx.drawImage(results.image, 0, 0, mpPreview.width, mpPreview.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                var lm = results.multiHandLandmarks[0];
                // 画骨架连线
                try {
                    window.drawConnectors(mpPreviewCtx, lm, window.HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                    window.drawLandmarks(mpPreviewCtx, lm, { color: '#FF0000', lineWidth: 1, radius: 2 });
                } catch(e){}

                // 取手掌中心: 手腕(0)和中指根(9)的中点
                var handX = (lm[0].x + lm[9].x) / 2;  // 归一化 0~1, 摄像头视角 左=0 右=1

                // 绝对位置映射: 前置摄像头镜像, 用户左手对应屏幕左侧, 故 1-handX
                // 手部水平位置直接等于飞船目标位置, 留 30px 边距
                camTargetX = 30 + (1 - handX) * (W - 60);

                // 更新状态文字
                var status = document.getElementById('l4-cam-status');
                if (status) status.textContent = '✋ 手x:' + (handX*100|0) + '%';
            } else {
                camTargetX = -1;   // 手丢失: 飞船保持当前位置
                var status2 = document.getElementById('l4-cam-status');
                if (status2) status2.textContent = '✋ 未检测到手';
            }
            mpPreviewCtx.restore();
        }
    }

    function updateModeUI() {
        var btn = document.getElementById('l4-mode-btn');
        var label = document.getElementById('l4-mode-label');
        if (camMode) {
            btn.textContent = '📷'; btn.classList.add('cam');
            label.innerHTML = '摄像头操控<br>点击切回';
        } else {
            btn.textContent = '👆'; btn.classList.remove('cam');
            label.innerHTML = '触摸操控<br>点击切换';
        }
    }
    window.L4_toggleMode = function() {
        console.log('[L4] toggleMode, camMode=', camMode);
        if (!camMode) {
            if (!window.isSecureContext && location.hostname !== 'localhost' && location.protocol !== 'https:') {
                say('摄像头需要 HTTPS 或 localhost 环境！请用 http://localhost:8090 访问。', true);
                return;
            }
            if (typeof window.Hands === 'undefined') {
                say('手部识别库未加载，请检查网络连接。', true);
                return;
            }
            camMode = true;
            updateModeUI();
            startCam();
        } else {
            camMode = false;
            stopCam();
            swipe.active = false; swipe.vx = 0;
            updateModeUI();
            say('切回触摸操控。');
        }
    };

    // ---------- 输入 ----------
    var inputSetup = false;
    function startGame() {
        gameStarted = true;
        $('start-prompt').style.display = 'none';
        lastTs = 0; stepAcc = 0;   // 重置固定步长累加器, 避免开局追帧
        say('小行星带就在前方，左右滑动闪避，危急时双指点击冻结互换！', true);
    }
    window.L4_selectMode = function(mode) {
        if (gameStarted || gameOver) return;
        gameMode = mode;
        timeLimit = mode === 1 ? 60000 : mode === 2 ? 180000 : 0;
        MAX_DIST = Infinity;
        elapsed = 0; score = 0; difficulty = 0;
        startGame();
    };
    // 读取 localStorage 高分并填充到卡片
    function loadHighScores() {
        for (var m = 1; m <= 3; m++) {
            var hs = 0;
            try { hs = parseInt(localStorage.getItem('l4_highscore_' + m) || '0', 10) || 0; } catch(e){}
            var el = document.getElementById('l4-best-' + m);
            if (el) el.textContent = hs > 0 ? '最高 ' + hs : '';
        }
    }
    function setupInput() {
        if (inputSetup) return;
        inputSetup = true;
        window.addEventListener('keydown', function(e) {
            if (activeView !== 'level4') return;
            keys[e.key] = true;
            if (e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key===' ') e.preventDefault();
            if (!gameStarted && !gameOver && gameMode > 0) { startGame(); }
            else if (e.key==='j'||e.key==='J') { enterSwap(); }
            else if (e.key==='m'||e.key==='M') { console.log('[L4] M键切换操控模式'); window.L4_toggleMode(); }
            if (e.key==='Escape' && swapMode) window.L4_cancelSwap();
        });
        window.addEventListener('keyup', function(e) { if (activeView==='level4') keys[e.key] = false; });

        var dragging = false;
        function pt(e) {
            var t = e.touches ? e.touches[0] : e;
            var r = canvas.getBoundingClientRect();
            return { x: t.clientX-r.left, y: t.clientY-r.top };
        }
        function down(e) {
            if (activeView!=='level4' || gameOver) return;
            if (!gameStarted && gameMode > 0) { startGame(); return; }
            if (!gameStarted) return;   // 未选模式: 忽略输入
            if (e.button === 2) { e.preventDefault(); enterSwap(); return; }
            var p = pt(e);
            if (swapMode) { trySelectAt(p.x, p.y); e.preventDefault(); return; }
            // 启动手势滑动追踪
            swipe.active = true;
            swipe.startX = p.x; swipe.startY = p.y;
            swipe.lastX = p.x; swipe.lastT = performance.now();
            swipe.vx = 0;
            dragging = true;
            if (e.preventDefault) e.preventDefault();
        }
        function move(e) {
            if (activeView!=='level4' || swapMode) return;
            if (!swipe.active) return;
            var p = pt(e);
            var now = performance.now();
            var dt = Math.max(1, now - swipe.lastT);
            // 瞬时水平速度(px/ms), 用指数移动平均平滑, 避免抖动
            var instVx = (p.x - swipe.lastX) / dt;
            swipe.vx = swipe.vx * 0.55 + instVx * 0.45;
            swipe.lastX = p.x; swipe.lastT = now;
            if (e.preventDefault) e.preventDefault();
        }
        function up() {
            dragging = false;
            swipe.active = false;
            swipe.vx = 0;
        }
        canvas.addEventListener('mousedown', down);
        canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        // 双指触摸 → 触发契约互换
        canvas.addEventListener('touchstart', function(e) {
            if (activeView!=='level4' || gameOver) return;
            if (!gameStarted && gameMode > 0) { startGame(); return; }
            if (!gameStarted) return;   // 未选模式: 忽略
            if (e.touches.length >= 2) {
                e.preventDefault();
                if (swapMode) window.L4_cancelSwap();
                else enterSwap();
                return;
            }
            down(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', up);
        window.addEventListener('resize', function(){ if (activeView==='level4') resize(); });
    }

    // ---------- 初始化 ----------
    levelInits['level4'] = function init() {
        canvas = document.getElementById('canvas-l4');
        ctx = canvas.getContext('2d');
        if (rafId) cancelAnimationFrame(rafId);
        gameStarted = false; gameOver = false; swapMode = false;
        resize();
        meteors = []; particles = []; keys = {};
        distance = 0; spawnTimer = 0; time = 0; screenShake = 0; flashRed = 0; sayLock = 0;
        gameMode = 0; timeLimit = 0; elapsed = 0; score = 0; difficulty = 0;
        lastTs = 0; stepAcc = 0;
        MAX_DIST = 8000;
        player.hp = 100; player.invuln = 0; player.vx = 0; player.tilt = 0;
        swipe.active = false; swipe.vx = 0;
        if (camMode) { camMode = false; stopCam(); updateModeUI(); }
        player.x = W/2; player.baseY = H-100; player.y = player.baseY;
        $('pass-screen').classList.remove('show');
        $('fail-screen').classList.remove('show');
        $('swap-hint').classList.remove('show');
        $('start-prompt').style.display = '';
        $('gesture-btn').classList.remove('swapping');
        $('hp-fill').style.width = '100%'; $('hp-fill').classList.remove('low');
        $('progress-fill').style.width = '0%';
        $('progress-label').textContent = '⏱ 选择模式开始';
        $('tangbao-body').textContent = '碎石与巨型陨石不断砸来，滑动屏幕左右闪避！';
        try { TangbaoVoice.speak('前方是小行星带！选择模式开始挑战。滑动屏幕左右移动，躲避碎石和巨型陨石。危急时双指点击屏幕冻结时空，点一颗陨石互换位置。'); } catch(e){}
        loadHighScores();
        setupInput();
        render();
    };
})();




// ===== 独立文件启动:直接进入第4关 =====
switchTo('level4');
</script>
